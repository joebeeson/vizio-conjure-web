<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIZIO Conjure web SDK smoke test</title>
  </head>
  <body>
    <main>
      <h1>CONJURE WEB SDK</h1>
      <p id="runtime">SDK bundle not loaded.</p>
      <nav aria-label="Smoke controls">
        <button type="button">One</button>
        <button type="button">Two</button>
        <button type="button">Three</button>
      </nav>
      <p id="focus-status">Focus: none</p>
    </main>
    <script type="module">
      const marker = document.querySelector("#runtime");
      marker.textContent = `Browser runtime ready at ${new Date().toISOString()}`;
      document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("focus", () => {
          document.querySelector("#focus-status").textContent = `Focus: ${button.textContent}`;
        });
      });
    </script>
  </body>
</html>
