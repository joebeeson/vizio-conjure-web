name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm trusted publishing requirements
        run: npm install --global 'npm@^11.5.1'
      - run: npm ci
      - name: Verify release version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: test "$(node -p "require('./package.json').version")" = "${TAG#v}"
      - run: npm run check
      - run: npm run test:coverage
      - name: Build package archive
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
      - name: Publish to npm
        shell: bash
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$package@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${package}@${version} already exists; skipping"
          elif [[ "$version" == *-* ]]; then
            npm publish --tag next --access public
          else
            npm publish --access public
          fi
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.tgz --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/*.tgz --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
